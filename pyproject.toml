[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="ai-memory-learning"
version="1.0.0"
description="Durable external AI memory and evidence-based experiential learning runtime"
requires-python=">=3.11"
dependencies=[]
[project.scripts]
aimemory="ai_memory_learning.cli:main"
[project.optional-dependencies]
test=["pytest>=8"]
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
